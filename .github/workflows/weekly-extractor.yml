name: Weekly Grocery Extraction

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      cfg_type:
        description: 'Select the configuration type'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard
          - custom

jobs:
  weekly_job:
    runs-on: ubuntu-latest
    environment: main-deployment

    container:
      image: python:3.12-slim
      options: --shm-size=2gb --security-opt seccomp=unconfined

    env:
      PYTHONUNBUFFERED: "1"
      HOME: "/root"
      MOZ_DISABLE_CONTENT_SANDBOX: "1"
      cfg_type: ${{ inputs.cfg_type || 'standard' }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PORT: ${{ secrets.DB_PORT }}
      CA_CERT: ${{ secrets.CA_CERT }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      FTP_REMOTE_BASEDIR: ${{ secrets.FTP_REMOTE_BASEDIR }}
      FTP_USER: ${{ secrets.FTP_USER }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GIT_DEPLOY_USER: ${{ secrets.GIT_DEPLOY_USER }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-firefox

      - name: Install System Dependencies for Firefox & Selenium Manager
        run: |
          apt-get update -yq
          apt-get install -y --no-install-recommends \
            firefox-esr \
            curl \
            ca-certificates \
            bzip2 \
            libgtk-3-0 \
            libdbus-glib-1-2 \
            libxt6

      - name: Debug environment
        run: |
          echo "HOME is: $HOME"
          echo "Whoami: $(whoami)"
          echo "id: $(id)"
          echo "Firefox version:"
          firefox --version || echo "firefox not found on PATH"
          echo "Contents of \$HOME:"
          ls -la "$HOME" || echo "cannot list HOME"
          echo "Selenium cache dir (if it exists):"
          ls -la "$HOME/.cache/selenium" 2>/dev/null || echo "no selenium cache dir yet"
          echo "/dev/shm size:"
          df -h /dev/shm

      - name: Install Python Dependencies & Run Script
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          echo "Running job with cfg_type=$cfg_type..."
          python main.py

      - name: Debug Selenium cache after run
        if: always()
        run: |
          echo "Selenium cache dir after run:"
          ls -la "$HOME/.cache/selenium" 2>/dev/null || echo "still no selenium cache dir — Selenium Manager likely never ran or failed silently"

      - name: Save Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-results
          path: |
            temp_output/results_JSON
            *.log
          retention-days: 7
