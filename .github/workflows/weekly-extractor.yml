name: Weekly Grocery Extraction

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  weekly_job:
    runs-on: ubuntu-latest
    environment: main-deployment

    container:
      image: python:3.12-slim

    env:
      PYTHONUNBUFFERED: "1"
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_USER: ${{ secrets.DB_USER }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      FTP_REMOTE_BASEDIR: ${{ secrets.FTP_REMOTE_BASEDIR }}
      FTP_USER: ${{ secrets.FTP_USER }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GIT_DEPLOY_USER: ${{ secrets.GIT_DEPLOY_USER }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-firefox

      - name: Install System Dependencies (Firefox)
        run: |
          apt-get update -yq
          apt-get install -y firefox-esr

      - name: Install Python Dependencies & Run Script
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          echo "Running weekly job with cached dependencies..."
          python main.py

      - name: Save Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-results
          path: |
            temp_output/results_JSON
            *.log
          retention-days: 7
