<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" type="text/css" href="styles.css">
  <script src="scripts.js"></script>
  <title>Handlelurt</title>
</head>
<body>
  <div class="container">
    <h1>Handlelurt (Uke {{index_uke}})</h1>
    <h2>Oppdateres hver mandag kl 12</h2>
    <h3>Utilgjengelige butikker: {{ utilgjengelige_butikker }}</h3>
    <div class="search-container">
      <div class="search-box">
        <div class="store-filter-container">
          <button class="store-filter-btn">Velg Butikker</button>
          <div class="store-filter-dropdown">
            <label><input type="checkbox" id="select-all-stores"> Vis alle butikker</label>
            <hr>
            <label><input type="checkbox" value="extra"> Coop Extra</label>
            <label><input type="checkbox" value="rema-1000"> Rema 1000</label>
            <label><input type="checkbox" value="bunnpris"> Bunnpris</label>
            <label><input type="checkbox" value="kiwi"> Kiwi</label>
            <label><input type="checkbox" value="meny"> Meny</label>
            <label><input type="checkbox" value="coop-prix"> Coop Prix</label>
            <label><input type="checkbox" value="joker"> Joker</label>
            <label><input type="checkbox" value="spar"> Spar</label>
            <label><input type="checkbox" value="coop-mega"> Coop Mega</label>
            <label><input type="checkbox" value="coop-marked"> Coop Marked</label>
            <label><input type="checkbox" value="obs"> Obs</label>
          </div>
        </div>
        
        <select id="dealType">
          <option value="salg">Salg</option>
          <option value="bogo">Buy one get one free o.l</option>
        </select>

        <select id="categoryFilter" onchange="handleCategoryChange()">
          <option value="">Alle kategorier</option>
          <option value="meat">Kjøtt</option>
          <option value="bread_toppings">Pålegg</option>
          <option value="dairy">Meieri</option>
          <option value="eggs">Egg</option>
          <option value="bakery">Bakevare</option>
          <option value="seafood">Sjømat</option>
          <option value="snacks_candy">Snacks/godteri</option>
          <option value="soda">Brus</option>
          <option value="produce">Grønnsaker/frukt</option>
          <option value="other">Annet</option>
        </select>

        <select id="proteinFilter" class="hidden">
          <option value="">Alle proteintyper</option>
          <option value="Ku">Ku</option>
          <option value="Svin">Svin</option>
          <option value="Kylling">Kylling</option>
          <option value="Lam">Lam</option>
          <option value="Blandet">Blandet</option>
          <option value="Plante-basert">Plante-basert</option>
        </select>
        
        <input type="text" id="search" placeholder="Søk etter matvare...">
        <button class="search-btn" onclick="searchFood()">🔍 Søk</button>
      </div>
    </div>
    
    <div class="results-container">
      <div class="initial-message">Skriv inn en matvare for å søke, eller skriv ingenting og få billigste alternativ</div>
    </div>
  </div>
</body>
</html>
