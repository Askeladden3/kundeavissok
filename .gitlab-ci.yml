stages:
  - run

variables:
  PYTHONUNBUFFERED: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

weekly_job:
  stage: run
  image: joyzours/python-selenium:latest
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
    - python main.py
  only:
    - schedules