stages:
  - build
  - store

# Stage 1: Run script and generate files
weekly_job:
  stage: build
  image: python:3.11
  script:
    # Install dependencies if needed
    - pip install -r requirements.txt
    # Create temp folder for intermediates
    - mkdir -p temp_output
    # Run your script (assume it puts images + JSON + DB file in temp_output)
    - python main.py --outdir temp_output
    # Move DB file to separate folder for persistence
    - mkdir -p db_output
    - mv temp_output/databaser/database.db db_output/
  artifacts:
    paths:
      - temp_output/
    expire_in: 1 week    # delete intermediates after a week
  only:
    - schedules

# Stage 2: Save DB file to separate branch
save_db:
  stage: store
  needs: ["weekly_job"]
  script:
    - git config --global user.name "CI Bot"
    - git config --global user.email "ci-bot@example.com"
    - git fetch origin
    - git checkout db-history || git checkout -b db-history
    - mkdir -p weekly_dbs/week-$(date +%V)
    - cp db_output/database.db weekly_dbs/week-$(date +%V)/
    - git add weekly_dbs/
    - git commit -m "Add database for week $(date +%V)"
    - git push origin db-history
  only:
    - schedules
