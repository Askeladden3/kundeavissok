stages:
  - run

weekly_job:
  stage: run
  image: python:3.12-slim
  variables:
    PYTHONUNBUFFERED: "1"
  before_script:
    - apt-get update && apt-get install -y chromium chromium-driver wget unzip
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
    - echo "Running weekly job on Docker Linux..."
    - python main.py
  only:
    - schedules