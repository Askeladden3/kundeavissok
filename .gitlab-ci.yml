stages:
  - run
  - store

default:
  image: python:3.11
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt


weekly_job:
  stage: run
  script:
    - echo "Running weekly job..."
    - python main.py
  artifacts:
    paths:
      - **temp_output/**
    expire_in: 1 week
  only:
    - schedules
