stages:
  - run

weekly_job:
  stage: run
  # Optional: Use tags to ensure this only runs on your specific shell runner
  # tags:
  #   - windows-shell 
  variables:
    PYTHONUNBUFFERED: "1"
  script:
    # 1. Create venv if it doesn't exist (PowerShell syntax)
    - if (!(Test-Path venv)) { python -m venv venv }
    
    # 2. Activate the virtual environment
    - .\venv\Scripts\Activate.ps1
    
    # 3. Install dependencies inside the venv
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
    
    # 4. Run the actual script
    - echo "Running weekly job on Windows Shell..."
    - python main.py
  only:
    - schedules